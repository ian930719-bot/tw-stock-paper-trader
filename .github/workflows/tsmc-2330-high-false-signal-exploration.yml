name: TSMC 2330 High False-Signal Filter Exploration (Isolated)
on:
  push:
    branches: [research/tsmc-2330-50cagr-trend-reentry]
    paths:
      - "tsmc_2330_4019_replication.py"
      - "tsmc_2330_high_false_signal_exploration.py"
      - "tests/test_tsmc_2330_high_false_signal_exploration.py"
      - ".github/workflows/tsmc-2330-high-false-signal-exploration.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  exploration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy requests scikit-learn
      - name: Restore immutable source data
        uses: actions/download-artifact@v4
        with:
          name: tsmc-2330-swing-research
          run-id: 43144543572
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source
      - name: Compile and test
        run: |
          python -m py_compile tsmc_2330_4019_replication.py tsmc_2330_high_false_signal_exploration.py
          python -m unittest tests/test_tsmc_2330_high_false_signal_exploration.py -v
      - name: Run fixed high-signal filters
        run: |
          python tsmc_2330_high_false_signal_exploration.py \
            --features source/artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv \
            --limits source/data/tsmc_2330/corporate_actions/price_limits_2330.csv \
            --dividends source/data/tsmc_2330/corporate_actions/TaiwanStockDividendResult_2330.csv \
            --output artifacts/tsmc_2330_high_false_signal_exploration
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tsmc-2330-high-false-signal-exploration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/tsmc_2330_high_false_signal_exploration/
