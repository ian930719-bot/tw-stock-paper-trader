name: TWSE TWT84U Historical Price-Limit Probe

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/twse-twt84u-historical-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe historical TWSE TWT84U date parameter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":"https://www.twse.com.tw/"})
          tests=[]
          urls=[
            ("rwd_afterTrading","https://www.twse.com.tw/rwd/zh/afterTrading/TWT84U",{"date":"20160504","response":"json"}),
            ("legacy_exchangeReport","https://www.twse.com.tw/exchangeReport/TWT84U",{"date":"20160504","response":"json"}),
            ("openapi_current","https://openapi.twse.com.tw/v1/exchangeReport/TWT84U",{}),
          ]
          for name,url,params in urls:
            try:
              r=s.get(url,params=params,timeout=(10,60));r.raise_for_status()
              j=r.json()
              if isinstance(j,list):
                fields=list(j[0].keys()) if j else []
                rows=[x for x in j if str(x.get("證券代號",x.get("證券代碼",x.get("Code","")))).strip()=="1727"]
                result={"name":name,"url":r.url,"status":r.status_code,"shape":len(j),"fields":fields,"1727_rows":rows[:5],"sample":j[:1]}
              else:
                tables=j.get("tables") or []
                table=next((t for t in tables if t.get("fields")),None)
                if table is None and isinstance(j.get("fields"),list):table={"fields":j["fields"],"data":j.get("data",[])}
                fields=table.get("fields",[]) if table else []
                code_i=next((i for i,x in enumerate(fields) if str(x).strip() in ("證券代號","證券代碼","股票代號")),None)
                rows=[x for x in table.get("data",[]) if code_i is not None and str(x[code_i]).strip()=="1727"] if table else []
                result={"name":name,"url":r.url,"status":r.status_code,"stat":j.get("stat"),"fields":fields,"1727_rows":rows[:5],"sample":(table.get("data") or [])[:1] if table else []}
              print(json.dumps(result,ensure_ascii=False))
              tests.append(result)
            except Exception as e:
              tests.append({"name":name,"url":url,"error":str(e)})
              print(json.dumps(tests[-1],ensure_ascii=False))
          Path("twse_twt84u_probe.json").write_text(json.dumps(tests,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twse-twt84u-historical-probe
          path: twse_twt84u_probe.json
          retention-days: 30
