name: 0050 Official TWSE Raw History

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - collect_0050_official_raw.py
      - .github/workflows/0050-official-raw.yml
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2010-01-04"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-11-20"

permissions:
  contents: read

concurrency:
  group: 0050-official-raw-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pandas requests
      - name: Compile 0050 collector
        run: python -m py_compile collect_0050_official_raw.py
      - name: Collect official 0050 raw daily OHLCV
        env:
          START_DATE: ${{ inputs.start_date || '2010-01-04' }}
          END_DATE: ${{ inputs.end_date || '2026-11-20' }}
        run: |
          python collect_0050_official_raw.py \
            --output data/0050_official_raw \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --pause-seconds 0.35
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/0050_official_raw/manifest.json").read_text(encoding="utf-8"))
          assert m["collection_complete"] and m["rows"] > 1000
          assert m["first_date"] <= "2010-12-31"
          assert m["last_date"] >= "2026-11-01"
          assert "4-for-1 split" in m["critical_corporate_action"]
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - name: Upload official 0050 raw history and provenance
        uses: actions/upload-artifact@v4
        with:
          name: 0050-official-raw-history
          path: data/0050_official_raw/
          if-no-files-found: error
          retention-days: 90
