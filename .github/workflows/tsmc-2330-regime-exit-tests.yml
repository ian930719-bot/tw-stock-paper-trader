name: TSMC 2330 Regime Exit Tests

on:
  push:
    branches:
      - research/tsmc-2330-regime-exit-attribution
    paths:
      - "tsmc_2330_execution_backtest.py"
      - "tests/test_tsmc_execution_backtest.py"
      - ".github/workflows/tsmc-2330-regime-exit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-exit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Compile execution module and tests
        run: |
          python -m py_compile tsmc_2330_execution_backtest.py
          python -m py_compile tests/test_tsmc_execution_backtest.py
      - name: Run execution and regime gate unit tests
        run: python -m unittest tests/test_tsmc_execution_backtest.py -v
