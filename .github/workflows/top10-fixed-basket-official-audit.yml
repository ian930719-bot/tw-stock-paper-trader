name: Fixed Ten-Stock Official Baseline Transfer Audit

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/top10-fixed-basket-official-audit.yml
      - top10_frozen_high_hold_transfer_audit.py
      - analyze_top10_false_signals.py
      - tsmc_2330_4019_replication.py
      - corporate_action_adjustments.py
      - collect_twse_twt49u_corporate_actions.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: top10-fixed-basket-official-audit-v4
  cancel-in-progress: true

jobs:
  fixed-basket:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download official raw OHLCV for ten fixed symbols
        uses: actions/download-artifact@v4
        with:
          name: top10-official-raw-ohlcv
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43225571777
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_official_raw
      - name: Download verified official corporate-action and special-event data
        uses: actions/download-artifact@v4
        with:
          name: tpex-official-data-smoke
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43343154492
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_actions_twt49u
      - name: Download official TWSE TWT84U daily price limits
        uses: actions/download-artifact@v4
        with:
          name: twse-official-daily-price-limits
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43394940710
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/twse_official_limits
      - name: Download official MOPS dividend components
        uses: actions/download-artifact@v4
        with:
          name: mops-official-dividend-component-overrides
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43411229575
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/mops_download
      - name: Collect corrected official TWT49U cash and stock dividend components
        run: |
          python -m py_compile collect_twse_twt49u_corporate_actions.py
          python collect_twse_twt49u_corporate_actions.py --start-date 2014-01-01 --end-date 2026-11-12 --output data/top10_actions_twt49u
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/top10_actions_twt49u/manifest.json").read_text(encoding="utf-8"))
          s=json.loads(Path("data/top10_actions_twt49u/special_events_manifest.json").read_text(encoding="utf-8"))
          assert m["complete"] and m["rows"] > 10000
          assert s["complete"] and s["tpex"]["exDailyQ_rows"] > 0
          print("TWT49U rows",m["rows"],"unresolved mixed actions",m["unresolved_action_component_events"],
                "special events",s["rows"],"TPEx events",s["tpex"]["exDailyQ_rows"])
          PY
      - name: Attach official TWSE price limits and MOPS component checkpoints
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path("data/top10_official_raw/bars")
          limits=pd.read_csv(next(Path("data/twse_official_limits").rglob("twse_twt84u_limits.csv")),dtype={"stock_id":str})
          valid=limits[["official_limit_up","official_reference_price","official_limit_down"]].notna().all(axis=1)
          limits=limits.loc[valid].copy()
          known=set(zip(pd.to_datetime(limits.date).dt.strftime("%Y-%m-%d"),limits.stock_id.astype(str).str.strip()))
          missing=[]
          for path in sorted(root.glob("*.csv")):
              raw=pd.read_csv(path,dtype={"symbol":str})
              raw["date"]=pd.to_datetime(raw.date,errors="coerce").dt.strftime("%Y-%m-%d")
              volume=pd.to_numeric(raw.volume,errors="coerce").fillna(0)
              for row in raw.loc[(raw.date>="2014-01-01")&(volume>0),["date","symbol"]].itertuples(index=False):
                  key=(str(row.date),str(row.symbol).strip())
                  if key not in known:missing.append(key)
          out=Path("data/fixed_missing_twt84u");daily=out/"daily";daily.mkdir(parents=True,exist_ok=True)
          by_day={}
          for day,symbol in missing:by_day.setdefault(day,set()).add(symbol)
          for day,symbols in by_day.items():
              pd.DataFrame([{"stock_id":symbol,"market":"TWSE"} for symbol in sorted(symbols)]).to_csv(daily/f"{day}.csv",index=False)
          ids=sorted({symbol for _,symbol in missing})
          pd.DataFrame([{"symbol":symbol,"stock_id":symbol,"market":"TWSE"} for symbol in ids]).to_csv(out/"universe.csv",index=False)
          print("Missing official TWT84U keys",len(missing),"symbols",ids,"dates",len(by_day))
          PY
          if [ -s data/fixed_missing_twt84u/universe.csv ] && [ "$(wc -l < data/fixed_missing_twt84u/universe.csv)" -gt 1 ]; then
            python collect_twse_twt84u_limits.py \
              --daily-dir data/fixed_missing_twt84u/daily \
              --universe-file data/fixed_missing_twt84u/universe.csv \
              --output data/twse_official_limits/fixed_missing_twt84u.csv \
              --pause 0.25
          fi
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          import pandas as pd
          root=Path("data/top10_official_raw/bars")
          limit_path=next(Path("data/twse_official_limits").rglob("twse_twt84u_limits.csv"))
          limits=pd.read_csv(limit_path,dtype={"stock_id":str})
          extra=Path("data/twse_official_limits/fixed_missing_twt84u.csv")
          if extra.exists():
              more=pd.read_csv(extra,dtype={"stock_id":str})
              limits=pd.concat([limits,more],ignore_index=True)
          limits["symbol"]=limits.stock_id.astype(str).str.strip()
          limits["date"]=pd.to_datetime(limits.date,errors="coerce").dt.strftime("%Y-%m-%d")
          limits=limits[["date","symbol","official_limit_up","official_reference_price","official_limit_down"]]
          if limits.duplicated(["date","symbol"]).any():
              raise RuntimeError("Duplicate official TWT84U date/symbol keys after targeted completion")
          manifest={"source":"TWSE official TWT84U","limits_rows":len(limits),"symbols":int(limits.symbol.nunique()),
                    "files":[],"missing_traded_rows_after_2015":0}
          for path in sorted(root.glob("*.csv")):
              raw=pd.read_csv(path,dtype={"symbol":str})
              raw["symbol"]=raw.symbol.astype(str).str.strip()
              raw["date"]=pd.to_datetime(raw.date,errors="coerce").dt.strftime("%Y-%m-%d")
              if "official_limit_up" in raw:
                  raw=raw.drop(columns=["official_limit_up","official_reference_price","official_limit_down"])
              merged=raw.merge(limits,on=["date","symbol"],how="left",validate="one_to_one")
              volume=pd.to_numeric(merged.volume,errors="coerce").fillna(0)
              strict=merged.date.ge("2015-01-01") & (volume>0)
              missing=merged.loc[strict & (merged.official_limit_up.isna() | merged.official_limit_down.isna() | merged.official_reference_price.isna()),"date"].tolist()
              if missing:
                  raise RuntimeError(f"{path.stem}: missing official TWT84U limits on {len(missing)} traded sessions; first={missing[:5]}")
              merged.to_csv(path,index=False)
              manifest["files"].append({"symbol":path.stem,"rows":len(merged),"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
              manifest["missing_traded_rows_after_2015"]+=len(missing)
          manifest["complete"]=manifest["missing_traded_rows_after_2015"]==0
          Path("data/twse_official_limits/fixed_basket_join_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          mops=Path("data/mops_download")
          override=next(mops.rglob("official_dividend_component_overrides.csv"))
          shutil.copy2(override,"data/official_dividend_component_overrides.csv")
          component=next(mops.rglob("mops_dividend_components.csv"))
          target=Path("data/mops_dividend_reconciliation");target.mkdir(parents=True,exist_ok=True)
          shutil.copy2(component,target/"mops_dividend_components.csv")
          mmanifest=next(mops.rglob("manifest.json"))
          shutil.copy2(mmanifest,target/"manifest.json")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          print("MOPS official component rows",sum(1 for _ in (target/"mops_dividend_components.csv").open(encoding="utf-8"))-1)
          PY
      - name: Upload official dividend and corporate-action checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: top10-fixed-basket-corporate-actions
          path: data/top10_actions_twt49u/
          if-no-files-found: error
          retention-days: 30
      - name: Run frozen high-hold strategy on the ten-stock fixed basket
        run: |
          python -m py_compile top10_frozen_high_hold_transfer_audit.py
          python top10_frozen_high_hold_transfer_audit.py --raw-bars data/top10_official_raw/bars --actions data/top10_actions_twt49u --output artifacts/top10_fixed_basket
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/top10_fixed_basket/report.json").read_text(encoding="utf-8"))
          print("STATUS",r["status"],"COMPLETED",r["symbols_completed"],"EXPECTED",r["symbols_expected"],"BLOCKED",len(r["blocked"]))
          print("TSMC_REPRODUCTION",json.dumps(r["tsmc_2330_universe_free_reproduction"],ensure_ascii=False))
          if r["symbols_completed"] == 0:
              raise SystemExit("No fixed-basket symbol passed the official-data gates.")
          PY
      - name: Analyze causal false-signal features with chronological holdout
        run: |
          python -m py_compile analyze_top10_false_signals.py
          python analyze_top10_false_signals.py \
            --trades artifacts/top10_fixed_basket/trade_feature_diagnostics_10bps.csv \
            --output artifacts/top10_fixed_basket/false_signal_analysis
      - name: Upload fixed-basket official audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: top10-fixed-basket-official-audit
          path: |
            data/top10_actions_twt49u/
            data/twse_official_limits/
            data/official_dividend_component_overrides.csv
            data/mops_dividend_reconciliation/
            artifacts/top10_fixed_basket/
          if-no-files-found: error
          retention-days: 30
