name: Collect TPEx Official Next-Day Price Limits

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/tpex-next-day-limit-collection.yml
      - collect_tpex_next_day_limits.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download all yearly official marketwide checkpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for year in {2014..2026}; do
            mkdir -p "data/year_${year}"
            gh run download 43357713305 --repo ian930719-bot/tw-stock-paper-trader \
              --name "top10-point-in-time-year-${year}" --dir "data/year_${year}"
          done
      - name: Merge daily marketwide files and point-in-time universe
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import pandas as pd
          root=Path("data/twse_marketwide_turnover")
          daily=root/"daily"; daily.mkdir(parents=True,exist_ok=True)
          frames=[]
          for year in range(2014,2027):
              src=Path(f"data/year_{year}")
              m=json.loads((src/"manifest.json").read_text(encoding="utf-8"))
              assert m["complete"] and m["dates_completed"]==m["dates_requested"], (year,m)
              for f in (src/"daily").glob("*.csv"):
                  shutil.copy2(f,daily/f.name)
              frames.append(pd.read_csv(src/"historical_daily_top10_by_volume.csv",
                                        dtype={"symbol":str,"stock_id":str}))
          top=pd.concat(frames,ignore_index=True).drop_duplicates(["date","symbol"])
          top.to_csv(root/"historical_daily_top10_by_volume.csv",index=False)
          print("DAILY_FILES",len(list(daily.glob("*.csv"))),"TOP10_ROWS",len(top),
                "TPEX_UNIVERSE",top.loc[top.market=="TPEX","stock_id"].nunique())
          PY
      - name: Collect official next-day limits for every TPEx point-in-time symbol
        run: |
          python -m py_compile collect_tpex_next_day_limits.py
          python collect_tpex_next_day_limits.py \
            --daily-dir data/twse_marketwide_turnover/daily \
            --universe-file data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv \
            --output artifacts/tpex_next_day_limits/tpex_next_day_limits.csv \
            --pause 0.30
      - name: Upload official TPEx next-day limit checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: tpex-official-next-day-limits
          path: artifacts/tpex_next_day_limits/
          if-no-files-found: error
          retention-days: 30
