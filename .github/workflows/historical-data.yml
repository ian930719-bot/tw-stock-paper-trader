name: Historical Taiwan Data Collection
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to collect (YYYY-MM-DD)"
        required: true
        default: "2010-01-04"
        type: string
      max_symbols:
        description: "Maximum symbols for this run; use 20 for a smoke test, 0 for all candidates"
        required: true
        default: "20"
        type: string
concurrency:
  group: historical-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/200cagr-blind-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate collection inputs
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date
          import os
          start = date.fromisoformat(os.environ["START_DATE"])
          limit = int(os.environ["MAX_SYMBOLS"])
          if limit < 0:
              raise SystemExit("max_symbols must be 0 or greater")
          print(f"Collection start: {start}; symbol limit: {limit or 'all'}")
          PY
        env:
          START_DATE: ${{ inputs.start_date }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
      - name: Collect raw daily bars
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          LIMIT_ARGS=()
          if [ "${{ inputs.max_symbols }}" != "0" ]; then
            LIMIT_ARGS+=(--max-symbols "${{ inputs.max_symbols }}")
          fi
          python historical_data_collector.py \
            --output data/taiwan_history \
            --start-date "${{ inputs.start_date }}" \
            "${LIMIT_ARGS[@]}"
      - name: Upload raw data and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-history-${{ github.run_id }}
          path: data/taiwan_history/
          if-no-files-found: warn
          retention-days: 30
