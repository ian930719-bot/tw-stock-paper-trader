name: Historical Taiwan Data Collection

on:
  push:
    branches: [research/200cagr-blind-validation]
    paths:
      - .github/run-historical-smoke
      - historical_data_collector.py
      - historical_data_audit.py
      - corporate_action_adjustments.py
      - streaming_factor_research.py
      - annual_top20_shared_capital_research.py
      - .github/workflows/historical-data.yml
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to collect (YYYY-MM-DD)"
        required: true
        default: "2010-01-04"
        type: string
      max_symbols:
        description: "Maximum symbols; 0 means all current and delisted candidates"
        required: true
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

# Serialize all collection batches on this branch. Each successful batch
# dispatches exactly one successor; queued duplicates must not run in parallel.
concurrency:
  group: historical-data-collection-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/200cagr-blind-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Restore resumable historical data cache
        uses: actions/cache/restore@v4
        with:
          path: data/taiwan_history/
          key: taiwan-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            taiwan-history-${{ github.ref_name }}-
      - run: pip install -r requirements.txt
      - name: Validate collection inputs
        env:
          START_DATE: ${{ inputs.start_date || '2010-01-04' }}
          MAX_SYMBOLS: ${{ inputs.max_symbols || (contains(github.event.head_commit.modified, '.github/run-historical-smoke') && '20' || '0') }}
        run: |
          python - <<'PY'
          from datetime import date
          import os
          start = date.fromisoformat(os.environ["START_DATE"])
          limit = int(os.environ["MAX_SYMBOLS"])
          if limit < 0:
              raise SystemExit("max_symbols must be 0 or greater")
          print(f"Collection start: {start}; symbol limit: {limit or 'all'}")
          PY
      - name: Collect raw daily bars
        id: collect
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          START_DATE: ${{ inputs.start_date || '2010-01-04' }}
          MAX_SYMBOLS: ${{ inputs.max_symbols || (contains(github.event.head_commit.modified, '.github/run-historical-smoke') && '20' || '0') }}
        run: |
          LIMIT_ARGS=()
          if [ "$MAX_SYMBOLS" != "0" ]; then
            LIMIT_ARGS+=(--max-symbols "$MAX_SYMBOLS")
          fi
          python historical_data_collector.py \
            --output data/taiwan_history \
            --start-date "$START_DATE" \
            --max-runtime-minutes 45 \
            --collect-corporate-actions \
            "${LIMIT_ARGS[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open("data/taiwan_history/download_manifest.json", encoding="utf-8"))
          print(f"collection_complete={str(m.get('collection_complete', False)).lower()}")
          print(f"corporate_actions_complete={str(m.get('corporate_actions_complete', False)).lower()}")
          print(f"remaining_symbols={m.get('remaining_symbols', 0)}")
          print(f"completed_symbols={m.get('completed_symbols', 0)}")
          PY
      - name: Audit historical data and write quality reports
        if: always() && hashFiles('data/taiwan_history/download_manifest.json') != ''
        run: |
          python historical_data_audit.py \
            --input data/taiwan_history

      - name: Save resumable historical data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/taiwan_history/
          key: taiwan-history-${{ github.ref_name }}-${{ github.run_id }}
      - name: Run exploratory factor research after full collection
        if: steps.collect.outcome == 'success' && steps.collect.outputs.collection_complete == 'true' && steps.collect.outputs.corporate_actions_complete == 'true'
        run: |
          python streaming_factor_research.py \
            --input data/taiwan_history \
            --output artifacts/streaming_factor_research \
            --split-date 2024-01-01
      - name: Run annual top-20 shared-capital strategy research after complete collection
        if: steps.collect.outcome == 'success' && steps.collect.outputs.collection_complete == 'true' && steps.collect.outputs.corporate_actions_complete == 'true'
        run: |
          python annual_top20_shared_capital_research.py \
            --input data/taiwan_history \
            --output artifacts/annual_top20_2016_2026
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/annual_top20_2016_2026/research_report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "data_start":r["data_start"],"data_end":r["data_end"],
              "symbols_with_valid_bars":r["symbols_with_valid_bars"],
              "annual_top20_coverage":r["annual_top20_coverage"],
              "strategy_results":r["strategy_results"],
              "limitations":r["limitations"],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload raw data, provenance, and research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-history-${{ github.run_id }}
          path: |
            data/taiwan_history/
            artifacts/streaming_factor_research/
            artifacts/annual_top20_2016_2026/
          if-no-files-found: warn
          retention-days: 30
      - name: Dispatch next resumable batch
        # Resume only unfinished price-symbol batches. A blocked global corporate-action
        # dataset must not create an endless chain when all price symbols are done.
        if: steps.collect.outcome == 'success' && steps.collect.outputs.collection_complete != 'true' && fromJSON(steps.collect.outputs.remaining_symbols || '0') > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.ref_name }}
          START_DATE: ${{ inputs.start_date || '2010-01-04' }}
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "ref": os.environ["TARGET_REF"],
              "inputs": {"start_date": os.environ["START_DATE"], "max_symbols": "0"}
          }
          with open("dispatch.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/historical-data.yml/dispatches" \
            -d @dispatch.json
          echo "Queued the next resumable collection run."
