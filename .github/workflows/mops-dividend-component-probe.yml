name: MOPS Official Dividend Component Probe

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/mops-dividend-component-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas beautifulsoup4 requests
      - name: Probe official MOPS dividend detail endpoints
        run: |
          python - <<'PY'
          import json, time, io
          from pathlib import Path
          import pandas as pd
          import requests
          from bs4 import BeautifulSoup
          session=requests.Session()
          session.headers.update({
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
            "Referer":"https://mops.twse.com.tw/mops/web/index",
            "Origin":"https://mops.twse.com.tw",
          })
          tests=[]
          def probe(name,endpoint,method,data=None,params=None):
            errors=[]
            for host in ["https://mops.twse.com.tw","https://mopsov.twse.com.tw"]:
              url=host+endpoint
              try:
                if method=="POST": r=session.post(url,data=data,params=params,timeout=60)
                else: r=session.get(url,params=params,timeout=60)
                r.raise_for_status()
                r.encoding="utf-8"
                text=r.text
                soup=BeautifulSoup(text,"html.parser")
                parsed=[]
                for table in soup.find_all("table")[:12]:
                  rows=[]
                  for tr in table.find_all("tr"):
                    cells=[cell.get_text(" ",strip=True) for cell in tr.find_all(["th","td"])]
                    if cells: rows.append(cells)
                  if rows: parsed.append({"class":table.get("class"),"rows":rows[:100]})
                hidden={node.get("name"):node.get("value") for node in soup.find_all("input") if node.get("name") in {"filename","year","co_id","TYPEK"}}
                result={"name":name,"url":r.url,"status":r.status_code,"content_type":r.headers.get("content-type"),"length":len(text),"contains_1727":"1727" in text,"html_start":text[:1800],"hidden":hidden,"tables":parsed}
                print(json.dumps(result,ensure_ascii=False))
                tests.append(result)
                if name=="t05st09_company_1727_dividend_year_103":
                  Path("mops_t05st09_1727_103.html").write_text(text,encoding="utf-8")
                elif name=="t108sb27_all_listed_2015":
                  Path("mops_t108sb27_sii_2015.html").write_text(text,encoding="utf-8")
                elif name=="t108sb27_all_otc_2015":
                  Path("mops_t108sb27_otc_2015.html").write_text(text,encoding="utf-8")
                elif name.startswith("t108sb27_sii_"):
                  Path(name+".html").write_text(text,encoding="utf-8")
                if "FOR SECURITY REASONS" in text or "因為安全性考量" in text:
                  errors.append({"url":r.url,"error":"MOPS security interstitial; trying alternate host"})
                  continue
                return
              except Exception as e: errors.append({"url":url,"error":str(e)})
            tests.append({"name":name,"errors":errors})
            print(json.dumps(tests[-1],ensure_ascii=False))
          probe("t05st09_company_1727_dividend_year_103","/mops/web/ajax_t05st09","POST",data={
            "encodeURIComponent":"1","step":"1","firstin":"1","off":"1","keyword4":"","code1":"",
            "TYPEK2":"","checkbtn":"","queryName":"co_id","inpuType":"co_id","TYPEK":"all",
            "isnew":"false","co_id":"1727","year":"103"
          })
          time.sleep(1)
          probe("t108sb27_all_listed_2015","/mops/web/ajax_t108sb27","GET",params={
            "step":"1","firstin":"true","off":"1","TYPEK":"sii","co_id_1":"","co_id_2":"",
            "year":"104","month":"","b_date":"","e_date":"","type":"1","rulesubmit2":"搜尋"
          })
          time.sleep(1)
          probe("t108sb27_all_otc_2015","/mops/web/ajax_t108sb27","GET",params={
            "step":"1","firstin":"true","off":"1","TYPEK":"otc","co_id_1":"","co_id_2":"",
            "year":"104","month":"","b_date":"","e_date":"","type":"1","rulesubmit2":"搜尋"
          })
          # Targeted issuer queries for the remaining top-ten unresolved mixed events.
          # These are diagnostic only: no values are accepted into the accounting
          # overrides unless the full reference-price reconciliation succeeds.
          for code,roc_year in [
            ("2888","104"),("2888","107"),("2888","110"),
            ("2892","104"),("5880","105")
          ]:
            time.sleep(1)
            probe(f"t108sb27_sii_{code}_{roc_year}","/mops/web/ajax_t108sb27","GET",params={
              "step":"1","firstin":"true","off":"1","TYPEK":"sii",
              "co_id_1":code,"co_id_2":code,"year":roc_year,"month":"",
              "b_date":"","e_date":"","type":"1","rulesubmit2":"搜尋"
            })
          for name,url in [
            ("twse_openapi_json","https://openapi.twse.com.tw/v1/opendata/t187ap45_L"),
            ("mopsfin_csv","https://mopsfin.twse.com.tw/opendata/t187ap45_L.csv"),
          ]:
            try:
              response=session.get(url,timeout=90);response.raise_for_status()
              if "json" in response.headers.get("content-type","").lower():
                frame=pd.DataFrame(response.json())
              else:
                frame=pd.read_csv(io.BytesIO(response.content),encoding="utf-8-sig",dtype={"公司代號":str})
              years=sorted(frame.get("股利年度",pd.Series(dtype=str)).astype(str).unique().tolist())
              rows=frame[frame.get("公司代號",pd.Series(dtype=str)).astype(str).str.strip()=="1727"]
              result={"name":name,"url":response.url,"status":response.status_code,"content_type":response.headers.get("content-type"),
                      "rows":len(frame),"years":years,"1727_rows":rows.fillna("").to_dict("records")[:20],
                      "columns":list(frame.columns)}
              print(json.dumps(result,ensure_ascii=False))
              tests.append(result)
            except Exception as e:
              tests.append({"name":name,"url":url,"error":str(e)})
          Path("mops_dividend_probe.json").write_text(json.dumps(tests,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mops-official-dividend-probe
          path: |
            mops_dividend_probe.json
            mops_t05st09_1727_103.html
            mops_t108sb27_sii_2015.html
            mops_t108sb27_otc_2015.html
            t108sb27_sii_*.html
          retention-days: 30
