name: TSMC 2330 Institutional Flow Annual OOF
on:
  push:
    branches:
      - research/tsmc-2330-50cagr-trend-reentry
    paths:
      - "tsmc_2330_institutional_flow_oof.py"
      - "tests/test_tsmc_2330_institutional_flow_oof.py"
      - ".github/workflows/tsmc-2330-institutional-flow-oof.yml"
permissions:
  actions: read
  contents: read
jobs:
  institutional-oof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Download preserved source artifact with institutional data
        uses: actions/download-artifact@v4
        with:
          name: tsmc-2330-swing-research
          run-id: 43144543572
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source
      - name: Download complete-horizon causal low event ledger
        uses: actions/download-artifact@v4
        with:
          name: tsmc-2330-complete-causal-low-research-43215156140
          run-id: 43215156140
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: event_source
      - name: Compile and test
        run: |
          python -m py_compile tsmc_2330_institutional_flow_oof.py
          python -m unittest discover -s tests -p 'test_tsmc_2330_institutional_flow_oof.py' -v
      - name: Compare technical and institutional flow models with annual OOF
        run: |
          python tsmc_2330_institutional_flow_oof.py \
            --events event_source/tsmc_2330_causal_low_pivot_quality/causal_low_pivot_quality_events.csv \
            --chip source/data/tsmc_2330/chip/2330_chip_features.csv \
            --output artifacts/tsmc_2330_institutional_flow_oof
      - uses: actions/upload-artifact@v4
        with:
          name: tsmc-2330-institutional-flow-oof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/tsmc_2330_institutional_flow_oof/
