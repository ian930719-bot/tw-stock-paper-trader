name: Validate app
on:
  push:
    branches: [main, research/200cagr-blind-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile historical_research.py historical_data_collector.py corporate_action_adjustments.py streaming_factor_research.py adaptive_exit_monitor.py paper_worker.py app.py corporate_actions.py trading_config.py broker_gateway.py trading_mode.py research_engine.py strategy_evolution.py continuous_walk_forward.py cross_sectional_momentum.py high_conviction_breakout.py minervini_vcp_breakout.py multifactor_engine.py fundamental_factors.py point_in_time_data.py universe_history.py walk_forward.py market_data.py analytics.py portfolio_risk.py stock_universe.py historical_store.py execution_engine.py paper_account.py stop_monitor.py strategy_exits.py taiwan_market_rules.py taiwan_trading_calendar.py market_trading_calendar.py taiwan_price_limits.py taiwan_factor_data.py swing_turning_point_research.py tests/test_swing_turning_point_research.py tests/test_historical_research.py tests/test_historical_data_collector.py tests/test_streaming_factor_research.py tests/test_corporate_action_adjustments.py tests/test_taiwan_factor_data.py tests/test_market_trading_calendar.py tests/test_taiwan_price_limits.py tests/test_taiwan_market_rules.py tests/test_taiwan_trading_calendar.py tests/test_strategy_exits.py tests/test_stop_monitor.py tests/test_execution_engine.py tests/test_paper_account.py tests/test_historical_store.py tests/test_corporate_actions.py tests/test_research_engine.py tests/test_strategy_evolution.py tests/test_multifactor_engine.py tests/test_fundamental_factors.py tests/test_point_in_time_data.py tests/test_universe_history.py tests/test_market_data.py tests/test_analytics.py tests/test_portfolio_risk.py tests/test_stock_universe.py tests/test_walk_forward.py tests/test_continuous_walk_forward.py tests/test_cross_sectional_momentum.py tests/test_high_conviction_breakout.py tests/test_staged_trading.py tests/test_adaptive_exit_monitor.py tests/test_paper_worker.py annual_top20_shared_capital_research.py tests/test_annual_top20_shared_capital_research.py research/tsmc_2330_parameter_sweep.py research/tsmc_2330_swing_low_high.py research/tsmc_2330_swing_event_study_v3.py research/tsmc_2330_swing_path_study_v4.py research/tsmc_2330_swing_sensitivity_bootstrap_v5.py research/tsmc_2330_core_tactical_allocation_v7.py research/tsmc_2330_causal_warning_walkforward_v6.py research/tsmc_2330_exit_policy_v8.py research/tsmc_2330_strategy_family_sweep_v9.py research/tsmc_2330_small_swing_v10.py research/tsmc_2330_reentry_v11.py research/tsmc_2330_overnight_gap_v12.py research/tsmc_2330_trend_regime_v13.py research/tsmc_2330_core_tactical_v14.py research/taiwan_top20_cross_sectional_momentum_v15.py research/taiwan_top20_momentum_trend_breadth_v16.py
      - run: python -m unittest discover -s tests -v
