name: Validate app
on:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile adaptive_exit_monitor.py paper_worker.py app.py trading_config.py broker_gateway.py trading_mode.py research_engine.py strategy_evolution.py multifactor_engine.py fundamental_factors.py point_in_time_data.py walk_forward.py market_data.py analytics.py portfolio_risk.py stock_universe.py historical_store.py execution_engine.py paper_account.py stop_monitor.py strategy_exits.py taiwan_market_rules.py taiwan_trading_calendar.py market_trading_calendar.py taiwan_price_limits.py taiwan_factor_data.py tests/test_taiwan_factor_data.py tests/test_market_trading_calendar.py tests/test_taiwan_price_limits.py tests/test_taiwan_market_rules.py tests/test_taiwan_trading_calendar.py tests/test_strategy_exits.py tests/test_stop_monitor.py tests/test_execution_engine.py tests/test_paper_account.py tests/test_historical_store.py tests/test_research_engine.py tests/test_strategy_evolution.py tests/test_multifactor_engine.py tests/test_fundamental_factors.py tests/test_point_in_time_data.py tests/test_market_data.py tests/test_analytics.py tests/test_portfolio_risk.py tests/test_stock_universe.py tests/test_walk_forward.py tests/test_staged_trading.py tests/test_adaptive_exit_monitor.py tests/test_paper_worker.py
      - run: python -m unittest discover -s tests -v
