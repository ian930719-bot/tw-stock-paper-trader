name: Validate app
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install streamlit yfinance pandas numpy plotly requests scikit-learn
      - run: python -m py_compile app.py research_engine.py tests/test_research_engine.py
      - run: python -m unittest discover -s tests -v
