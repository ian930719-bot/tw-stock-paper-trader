name: Official TWSE Historical Corporate Actions TWT49U

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - collect_twse_twt49u_corporate_actions.py
      - .github/workflows/top10-twt49u-actions.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: top10-twt49u-actions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Collect official TWT49U history without paid token
        run: |
          python -m py_compile collect_twse_twt49u_corporate_actions.py
          python collect_twse_twt49u_corporate_actions.py --start-date 2010-01-04 --end-date 2026-11-12 --output data/top10_actions_twt49u
      - uses: actions/upload-artifact@v4
        with:
          name: top10-official-twt49u-corporate-actions
          path: data/top10_actions_twt49u/
          if-no-files-found: error
          retention-days: 30
