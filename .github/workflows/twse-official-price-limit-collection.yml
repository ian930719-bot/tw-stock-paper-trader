name: Collect TWSE Official Daily Price Limits

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/twse-official-price-limit-collection.yml
      - collect_twse_twt84u_limits.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download all yearly official marketwide checkpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for year in {2014..2026}; do
            mkdir -p "data/year_${year}"
            gh run download 43357713305 --repo ian930719-bot/tw-stock-paper-trader \
              --name "top10-point-in-time-year-${year}" --dir "data/year_${year}"
          done
      - name: Merge daily marketwide files and point-in-time universe
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import pandas as pd
          root=Path("data/twse_marketwide_turnover")
          daily=root/"daily"; daily.mkdir(parents=True,exist_ok=True)
          frames=[]
          for year in range(2014,2027):
              src=Path(f"data/year_{year}")
              m=json.loads((src/"manifest.json").read_text(encoding="utf-8"))
              assert m["complete"] and m["dates_completed"]==m["dates_requested"], (year,m)
              for f in (src/"daily").glob("*.csv"): shutil.copy2(f,daily/f.name)
              frames.append(pd.read_csv(src/"historical_daily_top10_by_volume.csv",dtype={"symbol":str,"stock_id":str}))
          top=pd.concat(frames,ignore_index=True).drop_duplicates(["date","symbol"])
          top.to_csv(root/"historical_daily_top10_by_volume.csv",index=False)
          print("DAILY_FILES",len(list(daily.glob("*.csv"))),"TOP10_ROWS",len(top),
                "TWSE_UNIVERSE",top.loc[top.market=="TWSE","stock_id"].nunique())
          PY
      - name: Collect official daily limits for every TWSE point-in-time symbol
        run: |
          python -m py_compile collect_twse_twt84u_limits.py
          python collect_twse_twt84u_limits.py \
            --daily-dir data/twse_marketwide_turnover/daily \
            --universe-file data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv \
            --output artifacts/twse_official_limits/twse_twt84u_limits.csv \
            --pause 0.30
      - name: Validate known 1727 historical reference and limits
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("artifacts/twse_official_limits/twse_twt84u_limits.csv",dtype={"stock_id":str})
          r=d[(d.stock_id=="1727")&(d.date=="2016-05-04")]
          assert len(r)==1, "Missing 1727 2016-05-04 official TWT84U row"
          x=r.iloc[0]
          assert abs(float(x.official_limit_up)-15.15)<1e-8
          assert abs(float(x.official_reference_price)-13.80)<1e-8
          assert abs(float(x.official_limit_down)-12.45)<1e-8
          print("PASS 1727 2016-05-04",x.to_dict())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twse-official-daily-price-limits
          path: artifacts/twse_official_limits/
          if-no-files-found: error
          retention-days: 30
