name: TSMC 2330 Paired Annual Blind Validation
on:
  push:
    branches: [research/200cagr-blind-validation]
    paths:
      - "tsmc_swing_research.py"
      - "tsmc_2330_paired_annual_blind_validation.py"
      - "tsmc_2330_false_signal_diagnostics.py"
      - "tests/test_tsmc_2330_paired_annual_blind_validation.py"
      - "tests/test_tsmc_2330_false_signal_diagnostics.py"
      - ".github/workflows/tsmc-2330-paired-blind-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tsmc-2330-paired-blind-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-blind-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      VALIDATION_PROTOCOL_VERSION: paired-year-70-30-v7-core28
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Restore existing Run 565 historical data artifact
        uses: actions/download-artifact@v4
        with:
          name: taiwan-history-42941077075
          run-id: 42941077075
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: historical_artifact
      - name: Prepare the existing TSMC 2330 history
        run: |
          test -s historical_artifact/data/taiwan_history/bars/2330.csv
          test -s historical_artifact/data/taiwan_history/corporate_actions/events.csv
          mkdir -p data/tsmc_2330/bars artifacts/tsmc_2330_swing
          cp historical_artifact/data/taiwan_history/bars/2330.csv data/tsmc_2330/bars/2330.csv
      - name: Compile research code and run protocol tests
        run: |
          python -m py_compile tsmc_swing_research.py corporate_action_adjustments.py tsmc_2330_paired_annual_blind_validation.py tsmc_2330_false_signal_diagnostics.py tests/test_tsmc_2330_paired_annual_blind_validation.py tests/test_tsmc_2330_false_signal_diagnostics.py
          python -m unittest discover -s tests -p "test_tsmc_2330_paired_annual_blind_validation.py" -v
          python -m unittest discover -s tests -p "test_tsmc_2330_false_signal_diagnostics.py" -v
      - name: Build causal TSMC features and retrospective pivot outcomes
        run: |
          python tsmc_swing_research.py \
            --input data/tsmc_2330 \
            --output artifacts/tsmc_2330_swing \
            --corporate-actions historical_artifact/data/taiwan_history/corporate_actions/events.csv
      - name: Run 70/30 paired-year blind validation
        run: |
          python tsmc_2330_paired_annual_blind_validation.py \
            --features artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv \
            --events artifacts/tsmc_2330_swing/tsmc_2330_pivot_events.csv \
            --output artifacts/tsmc_2330_swing \
            --data-audit historical_artifact/data/taiwan_history/data_audit_summary.json
      - name: Classify OOF true and false signal outcomes
        run: |
          python tsmc_2330_false_signal_diagnostics.py \
            --features artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv \
            --events artifacts/tsmc_2330_swing/tsmc_2330_pivot_events.csv \
            --predictions artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_predictions.csv \
            --output artifacts/tsmc_2330_swing
      - name: Upload reproducible blind-validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: tsmc-2330-paired-annual-blind-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/tsmc_2330/bars/2330.csv
            historical_artifact/data/taiwan_history/data_audit_summary.json
            artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv
            artifacts/tsmc_2330_swing/tsmc_2330_pivot_events.csv
            artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_blind_validation.csv
            artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_blind_validation.json
            artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_calibration.csv
            artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_predictions.csv
            artifacts/tsmc_2330_swing/tsmc_2330_paired_annual_pooled_oof.csv
            artifacts/tsmc_2330_swing/tsmc_2330_oof_signal_outcomes.csv
            artifacts/tsmc_2330_swing/tsmc_2330_oof_signal_outcome_summary.csv
            artifacts/tsmc_2330_swing/tsmc_2330_oof_signal_feature_medians.csv
