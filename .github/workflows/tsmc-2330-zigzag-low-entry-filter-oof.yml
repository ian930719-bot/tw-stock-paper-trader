name: TSMC 2330 ZigZag Low Entry Filter Annual OOF

on:
  push:
    branches:
      - research/tsmc-2330-50cagr-trend-reentry
    paths:
      - "tsmc_2330_zigzag_low_entry_filter_oof.py"
      - "tsmc_2330_causal_zigzag_wave_oof.py"
      - "tests/test_tsmc_2330_zigzag_low_entry_filter_oof.py"
      - ".github/workflows/tsmc-2330-zigzag-low-entry-filter-oof.yml"

permissions:
  actions: read
  contents: read

jobs:
  oof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests scikit-learn
      - name: Download preserved source research artifact
        uses: actions/download-artifact@v4
        with:
          name: tsmc-2330-swing-research
          run-id: 43144543572
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source
      - name: Compile and test
        run: |
          python -m py_compile tsmc_2330_4019_replication.py tsmc_2330_causal_zigzag_wave_oof.py tsmc_2330_zigzag_low_entry_filter_oof.py
          python -m unittest tests/test_tsmc_2330_zigzag_low_entry_filter_oof.py -v
      - name: Run ZigZag low entry filter annual OOF
        run: |
          python tsmc_2330_zigzag_low_entry_filter_oof.py \
            --features source/artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv \
            --limits source/data/tsmc_2330/corporate_actions/price_limits_2330.csv \
            --dividends source/data/tsmc_2330/corporate_actions/TaiwanStockDividendResult_2330.csv \
            --output artifacts/tsmc_2330_zigzag_low_entry_filter_oof
      - uses: actions/upload-artifact@v4
        with:
          name: tsmc-2330-zigzag-low-entry-filter-oof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/tsmc_2330_zigzag_low_entry_filter_oof/
