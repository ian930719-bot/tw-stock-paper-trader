name: Validate Top 10 Research Data Gates

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - top10_frozen_high_hold_transfer_audit.py
      - collect_mops_dividend_components.py
      - .github/workflows/top10-research-syntax-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-data-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt lxml
      - name: Compile research modules
        run: |
          python -m py_compile top10_frozen_high_hold_transfer_audit.py collect_mops_dividend_components.py analyze_top10_false_signals.py
      - name: Test MOPS ROC date and numeric parsing
        run: |
          python - <<'PY'
          from collect_mops_dividend_components import rocdate, number
          assert rocdate("104/08/11") == "2015-08-11"
          assert rocdate("115.03.31") == "2026-03-31"
          assert number("新台幣10.0000元") == 10.0
          assert number("0.5000") == 0.5
          print("MOPS parsing checks passed")
          PY
      - name: Test official daily limit gates and missing OHLC handling
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from top10_frozen_high_hold_transfer_audit import build_limits
          twse=pd.DataFrame([{
            "date":"2016-05-04","note":"","volume":500,
            "open":np.nan,"high":np.nan,"low":np.nan,"close":np.nan,
            "official_limit_up":15.15,"official_reference_price":13.80,"official_limit_down":12.45
          }])
          limits=build_limits(twse,{},{},"TWSE_1727")
          assert limits["2016-05-04"] == (15.15,12.45)
          tpex=pd.DataFrame([
            {"date":"2015-01-05","note":"","volume":0,"open":np.nan,"high":np.nan,"low":np.nan,"close":np.nan,
             "next_day_limit_up":5.23,"next_day_limit_down":4.29},
            {"date":"2015-01-06","note":"","volume":100,"open":4.80,"high":4.90,"low":4.70,"close":4.85,
             "next_day_limit_up":5.10,"next_day_limit_down":4.20}
          ])
          tlimits=build_limits(tpex,{},{},"TPEX_5314")
          assert tlimits["2015-01-06"] == (5.23,4.29)
          print("Official price-limit checks passed")
          PY
