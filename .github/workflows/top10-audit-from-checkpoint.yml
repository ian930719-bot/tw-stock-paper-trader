name: Frozen Strategy Audit Using Verified Universe Checkpoint

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/top10-audit-from-checkpoint.yml
      - top10_frozen_high_hold_transfer_audit.py
      - tsmc_2330_4019_replication.py
      - corporate_action_adjustments.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: top10-audit-from-checkpoint
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Wait for the official point-in-time universe checkpoint from run 43342607119
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 720); do
            count=$(gh api repos/ian930719-bot/tw-stock-paper-trader/actions/runs/43342607119/artifacts --jq '.artifacts[] | select(.name=="top10-point-in-time-universe-checkpoint" and .expired==false) | .id' | wc -l)
            if [ "$count" -gt 0 ]; then
              found=1
              echo "Verified point-in-time universe checkpoint is available."
              break
            fi
            echo "Waiting for universe checkpoint: attempt $attempt/720"
            sleep 30
          done
          test "$found" -eq 1
      - name: Download verified official TWSE seed raw OHLCV
        uses: actions/download-artifact@v4
        with:
          name: top10-official-raw-ohlcv
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43225571777
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_official_raw
      - name: Download official point-in-time top-ten universe and raw constituent bars
        uses: actions/download-artifact@v4
        with:
          name: top10-point-in-time-universe-checkpoint
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43342607119
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/twse_marketwide_turnover
      - name: Download verified official corporate-action and special-event sources
        uses: actions/download-artifact@v4
        with:
          name: tpex-official-data-smoke
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43343154492
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_actions_twt49u
      - name: Collect official TWSE TWT49U dividend and stock-dividend results
        run: |
          python collect_twse_twt49u_corporate_actions.py --start-date 2014-01-01 --end-date 2026-11-12 --output data/top10_actions_twt49u
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/top10_actions_twt49u/manifest.json").read_text(encoding="utf-8"))
          s=json.loads(Path("data/top10_actions_twt49u/special_events_manifest.json").read_text(encoding="utf-8"))
          u=Path("data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv")
          assert m["complete"] and m["rows"]>10000
          assert s["complete"] and u.exists()
          print("TWT49U rows",m["rows"],"special events",s["rows"],"daily universe rows",sum(1 for _ in u.open(encoding="utf-8"))-1)
          PY
      - name: Upload complete official corporate-action checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: top10-official-corporate-actions-complete
          path: data/top10_actions_twt49u/
          if-no-files-found: error
          retention-days: 30
      - name: Run exact frozen TSMC high-hold transfer audit on historical daily top ten
        run: |
          python -m py_compile top10_frozen_high_hold_transfer_audit.py tsmc_2330_4019_replication.py
          python top10_frozen_high_hold_transfer_audit.py             --raw-bars data/twse_marketwide_turnover/symbol_bars             --universe-file data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv             --actions data/top10_actions_twt49u             --output artifacts/top10_full_official_audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/top10_full_official_audit/report.json").read_text(encoding="utf-8"))
          print("STATUS",r["status"],"COMPLETED",r["symbols_completed"],"EXPECTED",r["symbols_expected"],"BLOCKED",len(r["blocked"]))
          print("TSMC_REPRODUCTION",json.dumps(r["tsmc_2330_universe_free_reproduction"],ensure_ascii=False))
          print("SHARED_PORTFOLIO",json.dumps({k:v for k,v in (r.get("shared_capital_portfolio") or {}).items() if k not in {"trades","equity_curve"}},ensure_ascii=False))
          if r["symbols_completed"] == 0:
              raise SystemExit("No point-in-time top-ten constituent passed official-data gates.")
          PY
      - name: Upload full official top-ten audit results
        uses: actions/upload-artifact@v4
        with:
          name: top10-full-official-strategy-transfer-audit
          path: |
            artifacts/top10_full_official_audit/
            data/top10_official_raw/manifest.json
            data/twse_marketwide_turnover/manifest.json
            data/top10_actions_twt49u/
          if-no-files-found: error
          retention-days: 30
