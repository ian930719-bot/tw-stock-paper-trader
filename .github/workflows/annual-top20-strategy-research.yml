name: Annual Top 20 Shared-Capital Strategy Research

on:
  push:
    branches: [research/200cagr-blind-validation]
    paths:
      - annual_top20_shared_capital_research.py
      - tests/test_annual_top20_shared_capital_research.py
      - .github/workflows/annual-top20-strategy-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annual-top20-strategy-research-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/200cagr-blind-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore latest historical data cache
        uses: actions/cache/restore@v4
        with:
          path: data/taiwan_history/
          key: taiwan-history-${{ github.ref_name }}-nonexistent
          restore-keys: |
            taiwan-history-${{ github.ref_name }}-
      - name: Install research dependencies
        run: pip install numpy pandas
      - name: Compile and run regression tests
        run: |
          python -m py_compile annual_top20_shared_capital_research.py tests/test_annual_top20_shared_capital_research.py
          python -m unittest tests.test_annual_top20_shared_capital_research -v
      - name: Verify historical dataset and provenance
        run: |
          test -s data/taiwan_history/candidate_symbols.csv
          test -s data/taiwan_history/download_manifest.json
          test -d data/taiwan_history/bars
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("data/taiwan_history/download_manifest.json").read_text(encoding="utf-8"))
          print(json.dumps({k: m.get(k) for k in (
              "source", "start_date", "end_date", "requested_symbols",
              "successful_symbols", "empty_symbols", "failed_symbols",
              "collection_complete", "corporate_actions_complete",
              "point_in_time_universe_complete", "delisted_price_coverage_verified"
          )}, ensure_ascii=False, indent=2))
          if not m.get("collection_complete"):
              raise SystemExit("Historical bar collection is incomplete; refusing to rank a partial symbol universe.")
          PY
      - name: Run annual top-20 universe and shared-capital strategy comparison
        run: |
          python annual_top20_shared_capital_research.py \
            --input data/taiwan_history \
            --output artifacts/annual_top20_2016_2026
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/annual_top20_2016_2026/research_report.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "research_status": r["research_status"],
              "data_start": r["data_start"],
              "data_end": r["data_end"],
              "symbols_with_valid_bars": r["symbols_with_valid_bars"],
              "annual_top20_coverage": r["annual_top20_coverage"],
              "strategy_results": r["strategy_results"],
              "limitations": r["limitations"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload annual universe, trade ledger, equity curves and report
        uses: actions/upload-artifact@v4
        with:
          name: annual-top20-shared-capital-${{ github.run_id }}
          path: artifacts/annual_top20_2016_2026/
          if-no-files-found: error
          retention-days: 30
