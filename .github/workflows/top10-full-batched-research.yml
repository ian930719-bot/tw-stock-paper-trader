name: Complete Batched Point-in-Time Top 10 Research

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/top10-full-batched-research.yml
      - collect_twse_historical_daily_top10.py
      - top10_frozen_high_hold_transfer_audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: top10-full-batched-research
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete monolithic collector and its waiting audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for run_id in 43342607119 43356733682; do
            gh api --method POST "repos/ian930719-bot/tw-stock-paper-trader/actions/runs/${run_id}/cancel" || true
          done

  merge-and-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download official seed and verified corporate-action checkpoints
        uses: actions/download-artifact@v4
        with:
          name: top10-official-raw-ohlcv
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43225571777
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_official_raw
      - name: Download official TWT49U and special-event checkpoint
        uses: actions/download-artifact@v4
        with:
          name: top10-official-corporate-actions-with-terms
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43394241266
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_actions_twt49u
      - name: Download TPEx official next-day price-limit checkpoint
        uses: actions/download-artifact@v4
        with:
          name: tpex-official-next-day-limits
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43393298034
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/tpex_next_day_limits
      - name: Download TWSE official TWT84U daily price-limit checkpoint
        uses: actions/download-artifact@v4
        with:
          name: twse-official-daily-price-limits
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43394940710
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/twse_official_limits
      - name: Download official MOPS dividend component reconciliation
        uses: actions/download-artifact@v4
        with:
          name: mops-official-dividend-component-overrides
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43397039579
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/mops_dividend_refresh
      - name: Install MOPS official dividend components and raw source tables
        run: |
          set -euo pipefail
          test -s data/mops_dividend_refresh/official_dividend_component_overrides.csv
          cp data/mops_dividend_refresh/official_dividend_component_overrides.csv data/official_dividend_component_overrides.csv
          rm -rf data/mops_dividend_reconciliation
          cp -a data/mops_dividend_refresh/mops_dividend_reconciliation data/mops_dividend_reconciliation
      - name: Download all yearly universe checkpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for year in {2014..2026}; do
            mkdir -p "data/year_${year}"
            gh run download 43357713305 --repo ian930719-bot/tw-stock-paper-trader \
              --name "top10-point-in-time-year-${year}" --dir "data/year_${year}"
          done
      - name: Merge yearly official data into one verified point-in-time universe
        run: |
          python - <<'PY'
          import csv,hashlib,json,shutil
          from pathlib import Path
          import pandas as pd
          root=Path("data/twse_marketwide_turnover")
          daily=root/"daily"; daily.mkdir(parents=True,exist_ok=True)
          year_manifests=[]
          for year in range(2014,2027):
              src=Path(f"data/year_{year}")
              m=json.loads((src/"manifest.json").read_text(encoding="utf-8"))
              assert m["complete"] and m["dates_completed"]==m["dates_requested"], (year,m)
              year_manifests.append(m)
              for f in (src/"daily").glob("*.csv"):
                  shutil.copy2(f,daily/f.name)
          daily_files=sorted(daily.glob("*.csv"))
          assert daily_files, "No daily official market-wide files"
          frames=[]
          for year in range(2014,2027):
              f=Path(f"data/year_{year}/historical_daily_top10_by_volume.csv")
              frames.append(pd.read_csv(f,dtype={"symbol":str,"stock_id":str}))
          top=pd.concat(frames,ignore_index=True).sort_values(["date","rank_by_volume","symbol"])
          top=top.drop_duplicates(["date","symbol"])
          top.to_csv(root/"historical_daily_top10_by_volume.csv",index=False)
          union=sorted(top.symbol.astype(str).unique())
          bars=root/"symbol_bars"; bars.mkdir(exist_ok=True)
          handles={}
          try:
              for sym in union:
                  fh=(bars/f"{sym}.csv").open("w",newline="",encoding="utf-8")
                  wr=csv.writer(fh)
                  wr.writerow(["symbol","stock_id","market","name","date","open","high","low","close","volume","turnover","note","source"])
                  handles[sym]=(fh,wr)
              for f in daily_files:
                  d=pd.read_csv(f,dtype={"symbol":str,"stock_id":str})
                  d=d[d.symbol.isin(handles)]
                  for r in d.itertuples(index=False):
                      handles[str(r.symbol)][1].writerow([r.symbol,r.stock_id,r.market,r.name,r.date,r.open,r.high,r.low,r.close,r.volume_shares,r.turnover_ntd,getattr(r,"note",""),r.source])
          finally:
              for fh,wr in handles.values(): fh.close()
          dates=sorted({f.stem for f in daily_files})
          manifest={
              "source":["TWSE official MI_INDEX","TPEx official afterTrading/otc"],
              "markets_included":["TWSE","TPEX"],
              "dates_requested":sum(m["dates_requested"] for m in year_manifests),
              "dates_completed":len(dates),
              "complete":len(dates)==sum(m["dates_requested"] for m in year_manifests),
              "first_date":dates[0],"last_date":dates[-1],
              "top10_rows":len(top),"point_in_time_union_symbols":len(union),
              "symbol_bar_files":len(union),
              "top10_rows_by_market":top.market.value_counts().to_dict(),
              "sha256":hashlib.sha256((root/"historical_daily_top10_by_volume.csv").read_bytes()).hexdigest(),
              "yearly_checkpoints":[{"year":2014+i,"dates":m["dates_completed"],"complete":m["complete"]} for i,m in enumerate(year_manifests)],
              "method":"Each trading date ranked TWSE and TPEx four-digit common-stock rows together by official daily traded shares; top ten determined at close and eligible no earlier than next session.",
              "limitations":["Four-digit code class filter excludes 00xx ETF and 91xx TDR; six-digit warrants excluded.","Seed-stock trading calendar defines requested sessions; every year checkpoint is required complete.","All official daily raw rows are retained for any symbol that entered the point-in-time top ten at least once."]
          }
          assert manifest["complete"]
          (root/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Merge official TWSE and TPEx daily price limits into every symbol history
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          bars=Path("data/twse_marketwide_turnover/symbol_bars")
          tpex=pd.read_csv("data/tpex_next_day_limits/tpex_next_day_limits.csv",dtype={"stock_id":str})
          twse=pd.read_csv("data/twse_official_limits/twse_twt84u_limits.csv",dtype={"stock_id":str})
          for frame,label in ((tpex,"TPEx"),(twse,"TWSE")):
              if frame.duplicated(["date","stock_id"]).any():
                  raise RuntimeError(f"Duplicate {label} official price-limit date/symbol rows")
          summary={"tpex_limit_rows":len(tpex),"tpex_missing_rows":int(tpex.next_day_limit_up.isna().sum()+tpex.next_day_limit_down.isna().sum()),
                   "twse_limit_rows":len(twse),"twse_missing_rows":int(twse.official_limit_up.isna().sum()+twse.official_reference_price.isna().sum()+twse.official_limit_down.isna().sum()),
                   "tpex_symbols":int(tpex.stock_id.nunique()),"twse_symbols":int(twse.stock_id.nunique())}
          for path in sorted(bars.glob("TPEX_*.csv")):
              d=pd.read_csv(path,dtype={"stock_id":str})
              before=len(d);sid=path.stem.split("_",1)[1]
              lim=tpex[tpex.stock_id.astype(str)==sid][["date","stock_id","next_day_limit_up","next_day_limit_down"]]
              d=d.merge(lim,on=["date","stock_id"],how="left",validate="one_to_one")
              if len(d)!=before:raise RuntimeError(f"TPEx merge changed row count for {sid}")
              d.to_csv(path,index=False)
          for path in sorted(bars.glob("TWSE_*.csv")):
              d=pd.read_csv(path,dtype={"stock_id":str})
              before=len(d);sid=path.stem.split("_",1)[1]
              lim=twse[twse.stock_id.astype(str)==sid][["date","stock_id","official_limit_up","official_reference_price","official_limit_down","last_trading_day"]]
              d=d.merge(lim,on=["date","stock_id"],how="left",validate="one_to_one")
              if len(d)!=before:raise RuntimeError(f"TWSE merge changed row count for {sid}")
              d.to_csv(path,index=False)
          # Regression anchors: the 1727 missing-OHLC day still has official limits,
          # and TPEx publishes next-session limits on the source date.
          t=pd.read_csv(bars/"TWSE_1727.csv",dtype={"stock_id":str})
          x=t[t.date.astype(str)=="2016-05-04"]
          assert len(x)==1
          x=x.iloc[0]
          assert abs(float(x.official_limit_up)-15.15)<1e-8
          assert abs(float(x.official_reference_price)-13.80)<1e-8
          assert abs(float(x.official_limit_down)-12.45)<1e-8
          p=pd.read_csv(bars/"TPEX_5314.csv",dtype={"stock_id":str})
          q=p[p.date.astype(str)=="2018-10-24"]
          assert len(q)==1
          q=q.iloc[0]
          assert abs(float(q.next_day_limit_up)-5.23)<1e-8
          assert abs(float(q.next_day_limit_down)-4.29)<1e-8
          Path("data/twse_marketwide_turnover/official_limit_merge_manifest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Run full point-in-time universe transfer audit and shared-capital simulation
        run: |
          set -euo pipefail
          python -m py_compile top10_frozen_high_hold_transfer_audit.py analyze_top10_false_signals.py
          python top10_frozen_high_hold_transfer_audit.py \
            --raw-bars data/twse_marketwide_turnover/symbol_bars \
            --universe-file data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv \
            --actions data/top10_actions_twt49u \
            --output artifacts/top10_full_official_audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/top10_full_official_audit/report.json").read_text(encoding="utf-8"))
          print("STATUS",r["status"],"COMPLETED",r["symbols_completed"],"EXPECTED",r["symbols_expected"],"BLOCKED",len(r["blocked"]))
          print("TSMC_REPRODUCTION",json.dumps(r.get("tsmc_2330_universe_free_reproduction"),ensure_ascii=False))
          print("SHARED_PORTFOLIO",json.dumps({k:v for k,v in (r.get("shared_capital_portfolio") or {}).items() if k not in {"trades","equity_curve"}},ensure_ascii=False))
          if r["symbols_completed"]==0: raise SystemExit("No point-in-time constituent passed official data gates.")
          PY
      - name: Analyze pooled causal false-signal features with chronological holdout
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          import pandas as pd
          trades=Path("artifacts/top10_full_official_audit/trade_feature_diagnostics_10bps.csv")
          out=Path("artifacts/top10_full_official_audit/false_signal_analysis")
          d=pd.read_csv(trades)
          if d.empty:
              out.mkdir(parents=True,exist_ok=True)
              summary={"status":"INSUFFICIENT_EXECUTED_TRADES","total_trades":0,
                       "train_period":"2015-01-01 through 2021-12-31",
                       "test_period":"2022-01-01 through final official raw bar",
                       "filter_approval":"NONE"}
              (out/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
              (out/"methodology.txt").write_text("No executed trade rows were available. False-signal filters were not evaluated or approved.\n",encoding="utf-8")
              print(json.dumps(summary,ensure_ascii=False,indent=2))
          else:
              subprocess.run([sys.executable,"analyze_top10_false_signals.py","--trades",str(trades),"--output",str(out)],check=True)
          PY
      - name: Upload complete point-in-time top-ten research results
        uses: actions/upload-artifact@v4
        with:
          name: top10-complete-batched-research
          path: |
            data/twse_marketwide_turnover/manifest.json
            data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv
            data/twse_marketwide_turnover/official_limit_merge_manifest.json
            data/top10_actions_twt49u/
            data/tpex_next_day_limits/
            data/twse_official_limits/
            data/official_dividend_component_overrides.csv
            data/mops_dividend_reconciliation/
            artifacts/top10_full_official_audit/
          if-no-files-found: error
          retention-days: 30
