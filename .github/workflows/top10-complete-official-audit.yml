name: Complete Official Top 10 Strategy Transfer Audit

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - .github/workflows/top10-complete-official-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: top10-complete-official-audit
  cancel-in-progress: false

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download previously completed official TWSE seed OHLCV
        uses: actions/download-artifact@v4
        with:
          name: top10-official-raw-ohlcv
          repository: ian930719-bot/tw-stock-paper-trader
          run-id: 43225571777
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/top10_official_raw
      - name: Build full historical daily top ten and constituent raw OHLCV
        run: |
          python -m py_compile collect_twse_historical_daily_top10.py
          python collect_twse_historical_daily_top10.py --raw-bars data/top10_official_raw/bars --output data/twse_marketwide_turnover --pause 0.2
      - name: Collect all official TWT49U corporate actions
        run: |
          python -m py_compile collect_twse_twt49u_corporate_actions.py
          python collect_twse_twt49u_corporate_actions.py --start-date 2010-01-01 --end-date 2026-11-12 --output data/top10_actions_twt49u
      - name: Collect all official TWTAUU and TWTB8U special events
        run: |
          python -m py_compile collect_twse_special_corporate_actions.py
          python collect_twse_special_corporate_actions.py --start-date 2011-01-01 --end-date 2026-11-12 --output data/top10_actions_twt49u
      - name: Collect all official TPEx ex-rights and capital-reduction events
        run: |
          python -m py_compile collect_tpex_corporate_actions.py
          python collect_tpex_corporate_actions.py --start-date 2014-01-01 --end-date 2026-11-12 --special-start-date 2013-01-01 --output data/top10_actions_twt49u
      - name: Run frozen high-hold transfer audit across point-in-time top-ten constituents
        run: |
          python -m py_compile top10_frozen_high_hold_transfer_audit.py
          python top10_frozen_high_hold_transfer_audit.py --raw-bars data/twse_marketwide_turnover/symbol_bars --universe-file data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv --actions data/top10_actions_twt49u --output artifacts/top10_frozen_high_hold
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/top10_frozen_high_hold/report.json").read_text(encoding="utf-8"))
          print("AUDIT_STATUS",r["status"],"COMPLETED",r["symbols_completed"],"EXPECTED",r["symbols_expected"],"BLOCKED",len(r["blocked"]))
          if r["symbols_completed"] == 0:
              raise SystemExit("No symbol passed the official-data audit gates.")
          PY
      - name: Upload complete official data and audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: top10-complete-official-research-audit
          path: |
            data/twse_marketwide_turnover/manifest.json
            data/twse_marketwide_turnover/historical_daily_top10_by_volume.csv
            data/twse_marketwide_turnover/symbol_bars/
            data/top10_actions_twt49u/
            artifacts/top10_frozen_high_hold/
          if-no-files-found: error
          retention-days: 30
