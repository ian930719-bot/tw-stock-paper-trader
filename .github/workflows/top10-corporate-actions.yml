name: Top 10 Corporate Action Data

on:
  push:
    branches: [research/200cagr-blind-validation]
    paths:
      - .github/workflows/top10-corporate-actions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top10-corporate-actions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/200cagr-blind-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect verified corporate-action reference prices for the ten-stock study
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p data/top10_actions
          cat > data/top10_actions/candidate_symbols.csv <<'CSV'
          symbol,name
          2330,台積電
          2454,聯發科
          1303,南亞
          2327,國巨
          2408,南亞科
          2308,台達電
          3037,欣興
          3008,大立光
          2383,台光電
          2303,聯電
          CSV
          python - <<'PY'
          import json
          from historical_data_collector import collect_corporate_actions
          result = collect_corporate_actions(
              "data/top10_actions",
              "2010-01-04",
              pause_seconds=6.1,
          )
          print(json.dumps({k:v for k,v in result.items() if k != "status_rows"}, ensure_ascii=False, indent=2))
          if not result.get("corporate_actions_complete"):
              raise SystemExit("Corporate-action data collection is incomplete; refusing to publish research-grade inputs.")
          if result.get("event_conflicts", 0):
              raise SystemExit("Corporate-action ratios contain conflicts; review before backtesting.")
          PY
      - name: Upload ten-stock corporate-action data
        uses: actions/upload-artifact@v4
        with:
          name: top10-corporate-actions
          path: data/top10_actions/corporate_actions/
          if-no-files-found: error
          retention-days: 30
