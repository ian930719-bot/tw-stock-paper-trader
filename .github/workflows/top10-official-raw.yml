name: Top 10 Official TWSE Raw Data Collection

on:
  push:
    branches: [research/top10-official-ohlcv-baseline-audit]
    paths:
      - top10_official_raw_collector.py
      - .github/workflows/top10-official-raw.yml
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2010-01-04"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-11-12"

permissions:
  contents: read

concurrency:
  group: top10-official-raw-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top10-official-ohlcv-baseline-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile collector
        run: python -m py_compile top10_official_raw_collector.py
      - name: Collect official raw daily OHLCV for all ten symbols
        env:
          START_DATE: ${{ inputs.start_date || '2010-01-04' }}
          END_DATE: ${{ inputs.end_date || '2026-11-12' }}
        run: |
          python top10_official_raw_collector.py \
            --output data/top10_official_raw \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --pause-seconds 0.35
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/top10_official_raw/manifest.json").read_text(encoding="utf-8"))
          assert m["collection_complete"] and m["symbols_collected"] == 10
          assert all(x["rows"] > 1000 for x in m["status_rows"])
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - name: Upload official raw data and provenance
        uses: actions/upload-artifact@v4
        with:
          name: top10-official-raw-ohlcv
          path: data/top10_official_raw/
          if-no-files-found: error
          retention-days: 30
