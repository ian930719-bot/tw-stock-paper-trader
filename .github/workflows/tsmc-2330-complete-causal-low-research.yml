name: TSMC 2330 Complete Causal Low Quality Research
on:
  push:
    branches:
      - research/tsmc-2330-50cagr-trend-reentry
    paths:
      - "tsmc_2330_causal_low_pivot_quality.py"
      - "tsmc_2330_atr2_low_rule_oof.py"
      - "tests/test_tsmc_2330_causal_low_pivot_quality.py"
      - "tests/test_tsmc_2330_atr2_low_rule_oof.py"
      - ".github/workflows/tsmc-2330-complete-causal-low-research.yml"
permissions:
  actions: read
  contents: read
jobs:
  complete-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests scikit-learn
      - name: Download preserved official-source research data
        uses: actions/download-artifact@v4
        with:
          name: tsmc-2330-swing-research
          run-id: 43144543572
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source
      - name: Compile and run unit tests
        run: |
          python -m py_compile tsmc_2330_4019_replication.py tsmc_2330_causal_zigzag_wave_oof.py tsmc_2330_causal_low_pivot_quality.py tsmc_2330_atr2_low_rule_oof.py
          python -m unittest discover -s tests -p 'test_tsmc_2330_causal_low_pivot_quality.py' -v
          python -m unittest discover -s tests -p 'test_tsmc_2330_atr2_low_rule_oof.py' -v
      - name: Build causal event ledger with complete-horizon labels
        run: |
          python tsmc_2330_causal_low_pivot_quality.py \
            --features source/artifacts/tsmc_2330_swing/tsmc_2330_causal_features.csv \
            --limits source/data/tsmc_2330/corporate_actions/price_limits_2330.csv \
            --dividends source/data/tsmc_2330/corporate_actions/TaiwanStockDividendResult_2330.csv \
            --output artifacts/tsmc_2330_causal_low_pivot_quality
      - name: Run expanding annual OOF low-event rule discovery
        run: |
          python tsmc_2330_atr2_low_rule_oof.py \
            --events artifacts/tsmc_2330_causal_low_pivot_quality/causal_low_pivot_quality_events.csv \
            --output artifacts/tsmc_2330_atr2_low_rule_oof
      - name: Upload complete research ledger and OOF results
        uses: actions/upload-artifact@v4
        with:
          name: tsmc-2330-complete-causal-low-research-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/tsmc_2330_causal_low_pivot_quality/
            artifacts/tsmc_2330_atr2_low_rule_oof/
